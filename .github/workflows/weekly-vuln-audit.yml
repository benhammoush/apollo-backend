# Read-only lock audits, never upgrades, fixes or deployment.
name: Weekly vulnerability audit
on:
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Dependency audit
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev-win-py313.lock
      - name: Audit runtime and full verification dependencies
        run: python -B -m scripts.check_quality --audit-only
