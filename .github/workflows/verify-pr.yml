# Source-only merge-revision verification; never run on the MT5 host.
name: Verify PR
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: PR checks
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev-win-py313.lock
      - name: Verify source and synthetic contracts
        run: python -B -m scripts.check_quality
  verify_result:
    name: Verify
    needs: verify
    if: always()
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Require successful PR checks
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: if ($env:VERIFY_RESULT -ne 'success') { exit 1 }
