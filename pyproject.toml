# Source-only verification; not a package/distribution or runtime installer.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.mypy]
python_version = "3.13"
files = ["scripts", "tests/tooling", "tests/test_period_levels_removed.py", "tests/websocket_session.py", "tests/test_websocket_session.py", "tests/test_ownership_guards.py"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["api.*", "live.*", "shared.*"]
follow_imports = "skip"

# Legacy runtime code is checked by full synthetic tests, compilation and disclosure
# guards, not claimed to pass the new lint/format/type policy; see docs/verification.md.
